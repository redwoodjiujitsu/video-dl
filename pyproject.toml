[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vdl"
version = "0.1.0"
description = "Command-line video downloader for YouTube, Bilibili and other sites (built on yt-dlp)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # [default] pulls in the extras yt-dlp needs for YouTube's newer players.
    "yt-dlp[default]>=2025.1.1",
    # YouTube now needs a JavaScript runtime to unlock most formats.
    "deno>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vdl = "vdl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
